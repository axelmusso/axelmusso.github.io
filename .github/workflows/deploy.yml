name: Publicar site
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Ações fixadas pelo código exato (commit), para não receber mudanças sem revisão. O Dependabot propõe as atualizações.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Gerar site
        run: node build.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FORCE_PRODUCTION: ${{ vars.FORCE_PRODUCTION }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Testes de SEO
        run: node tests/check.mjs
      # Cópia de segurança desta versão no Supabase (código-fonte + site pronto). Não bloqueia a publicação se falhar.
      - name: Guardar esta versão no Supabase
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/backup.mjs site
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Cópia dos contatos do formulário (diária e nas publicações manuais), na mesma pasta privada.
      - name: Copiar os contatos do formulário
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/backup.mjs contatos
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
